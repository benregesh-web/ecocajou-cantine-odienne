<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cantine ECOCAJOU - Firebase Officiel</title>
<style>body{font-family:Arial;margin:0;padding:10px;background:#f5f5f5}.cacher{display:none}.bloc{border:1px solid #ccc;padding:12px;margin:8px 0;border-radius:8px;background:white}.section-bloc{border:1px solid #007bff;padding:8px;margin:5px 0;border-radius:6px;background:#fff}.mange{color:green;font-weight:bold}.present{color:orange}.totaux{display:flex;gap:8px;flex-wrap:wrap}.totaux div{flex:1;background:#eee;padding:10px;border-radius:6px;font-weight:bold;text-align:center}.online{position:fixed;top:5px;right:5px;background:#25D366;color:white;padding:5px 10px;border-radius:20px;font-size:11px;z-index:999}@media print{.no-print{display:none}}</style></head><body>
<link rel="stylesheet" href="style.css">
<div class="online no-print">🟢 ECOCAJOU Firebase - Live + Historique</div>
<div id="pageLogin" class="bloc"><h2>ECOCAJOU CANTINE - LOGIN</h2><input type="password" id="codeAcces" placeholder="Code " style="padding:10px"><button onclick="verifierAcces()" style="background:#007bff;color:white;padding:10px;border:none;border-radius:6px">Entrer</button><p id="msgErreur" style="color:red"></p></div>
<div id="pagePrincipale" class="cacher">
<div class="bloc no-print"><button onclick="deconnexion()" style="background:red;float:right;color:white;padding:6px;border:none;border-radius:4px">Sortir</button><h2>GESTION CANTINE ECOCAJOU SA ODIENNE </h2><p style="font-size:12px;color:green">✅ Base séparée de SANA - Tout reste stocké à vie</p>
<div style="display:flex;gap:6px;flex-wrap:wrap"><input type="date" id="selectDate"><button onclick="chargerJour()" style="background:#17a2b8;color:white;padding:8px;border:none;border-radius:5px">📅 Voir jour</button><button onclick="aujourdhui()" style="background:#007bff;color:white;padding:8px;border:none;border-radius:5px">Aujourd'hui</button><button onclick="imprimerTout()" style="background:purple;color:white;padding:8px;border:none;border-radius:5px">🖨️ TOUT IMPRIMER</button><button onclick="imprimerSectionPrompt()" style="background:#6f42c1;color:white;padding:8px;border:none;border-radius:5px">🖨️ 1 Section</button><button onclick="resetJour()" style="background:#dc3545;color:white;padding:8px;border:none;border-radius:5px">🗑️ Reset</button></div>
</div>
<div class="bloc no-print"><h3>➕ Ajouter Code </h3><input type="text" id="codeAjout" placeholder="Code Agent" style="padding:10px;width:180px"><select id="sectionAjout" style="padding:10px"></select><button onclick="ajouterCode()" style="background:#28a745;color:white;padding:10px;border:none;border-radius:6px">Ajouter</button><p id="msgAjout"></p></div>
<div class="bloc no-print"><h3>🍽️ Vérifier / Donner Plat</h3><input type="text" id="codeVerif" placeholder="Code Agent" style="padding:10px;width:180px"><button onclick="verifierCode()" style="background:#17a2b8;color:white;padding:10px;border:none;border-radius:6px">Vérifier</button><p id="msgVerif"></p></div>
<div class="bloc no-print"><div style="display:flex;gap:8px"><select id="selectSectionNav" style="flex:1;padding:8px"></select><button onclick="allerSection()" style="background:#6f42c1;color:white;padding:8px;border:none;border-radius:5px">Aller</button><input type="text" id="rechercheAgent" placeholder="Rechercher..." onkeyup="rechercherAgent()" style="flex:1;padding:8px"></div><div id="resultatRecherche"></div></div>
<h2 style="text-align:center">Pointage du <span id="titreDate"></span></h2>
<div class="totaux"><div id="totalEnregistres">ENREGISTRÉS: 0</div><div id="totalMangeGeneral">ONT MANGÉ: 0</div><div id="totalRestantGeneral">RESTANT: 0</div></div>
<div id="conteneurSections"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
// FIREBASE ECOCAJOU OFFICIEL - SÉPARÉ DE SANA
const firebaseConfig = {
  apiKey: "AIzaSyAS-thQH1Iy43biW_xRUMamDrxVbEYDjfc",
  authDomain: "ecocajou-cantine-odienne.firebaseapp.com",
  databaseURL: "https://ecocajou-cantine-odienne-default-rtdb.firebaseio.com",
  projectId: "ecocajou-cantine-odienne",
  storageBucket: "ecocajou-cantine-odienne.firebasestorage.app",
  messagingSenderId: "197945332133",
  appId: "1:197945332133:web:69ff670052cad9cde5d84c"
};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
const CODE_SECRET="BEN2026"; const CODE_RESET="RESET2026";
const sections=["DPM GROS SALLE","MAGASIN NOIX BRUTE","QUALITE NOIX BRUTE","CALLIBRAGE","CALLIBRAGE CARISTE","CHAUDIERE","COQUE","COQUE CHAUFFEUR","LAVAGE EQUIPEMENT","CUISSON","CUISSON CARISTE","DECO HOMME","DECO FEMME","QUALITE DECO","ENTRETIEN DECO","SCOOPING","SCOOPING CORRECTION","ETUVAGE","GESTIONNAIRE/MAGASIN PIECES DE RECHANGE","MAINTENANCE","CONTROLEUR FOUR","DP AUTO","CONCASSAGE","CLASS MANUEL","CLASS AUTO","EMBALLAGE 1","EMBALLAGE 2","ENTRETIEN EMBALLAGE","MAGASIN PRODUIT FINIS","DPM Elèves","Niamatogola","DPM CORRECTRISES","ENTRETIEN DPM","ENTRETIEN ZONE BLANCHE","ENTRETIEN ADMINISTRATION","OPERATEUR PESEE","SECTION HYGIENE","BUANDERIE","ENTRETIEN","ENTRETIEN ZONE NON BATI","CANTINE","DISTRI.PROD MAN","ADMINISTRATION","ELEVES GARCONS"];
let jourActuel=new Date().toISOString().split('T')[0]; let allData={}; let sectionBloquee="";
window.onload=()=>{ let s1=document.getElementById('sectionAjout'), s2=document.getElementById('selectSectionNav'); sections.forEach(s=>{ let o1=document.createElement('option'); o1.value=s; o1.textContent=s; s1.appendChild(o1); let o2=document.createElement('option'); o2.value=s; o2.textContent=s; s2.appendChild(o2); }); document.getElementById('selectDate').value=jourActuel; };
function ecouterJour(){ onValue(ref(db,'cantine/'+jourActuel),(snap)=>{ allData=snap.val()||{}; afficher(); }); document.getElementById('titreDate').innerText=jourActuel; }
window.verifierAcces=()=>{ if(document.getElementById('codeAcces').value===CODE_SECRET){ document.getElementById('pageLogin').classList.add('cacher'); document.getElementById('pagePrincipale').classList.remove('cacher'); ecouterJour(); } else document.getElementById('msgErreur').innerText="Faux code"; }
window.aujourdhui=()=>{ jourActuel=new Date().toISOString().split('T')[0]; document.getElementById('selectDate').value=jourActuel; sectionBloquee=""; ecouterJour(); }
window.chargerJour=()=>{ jourActuel=document.getElementById('selectDate').value; if(!jourActuel) return alert("Choisis date"); sectionBloquee=""; ecouterJour(); }
function existe(code){ for(let sec in allData){ if(allData[sec] && allData[sec][code]) return sec; } return null; }
window.ajouterCode=async()=>{ let code=document.getElementById('codeAjout').value.trim().toUpperCase(); let sec=document.getElementById('sectionAjout').value; if(!code) return alert("Code vide"); let ex=existe(code); if(ex){ document.getElementById('msgAjout').innerHTML=`<span style="color:red">❌ ${code} existe déjà dans ${ex} le ${jourActuel}</span>`; return; } await set(ref(db,'cantine/'+jourActuel+'/'+sec+'/'+code),{code,mange:false,heure:Date.now()}); document.getElementById('msgAjout').innerHTML=`<span style="color:green">✅ ${code} ajouté à ${sec}</span>`; document.getElementById('codeAjout').value=''; }
window.verifierCode=async()=>{ let code=document.getElementById('codeVerif').value.trim().toUpperCase(); if(!code) return; let sec=existe(code); let msg=document.getElementById('msgVerif'); if(!sec){ msg.innerHTML=`<span style="color:red">❌ ${code} non trouvé le ${jourActuel}</span>`; return; } let ag=allData[sec][code]; if(!ag.mange){ await set(ref(db,'cantine/'+jourActuel+'/'+sec+'/'+code),{...ag,mange:true,heureMange:Date.now()}); msg.innerHTML=`<span style="color:green">✅ ${code} (${sec}) → Plat donné - MANGÉ partout</span>`; } else { msg.innerHTML=`<span style="color:red">❌ ${code} (${sec}) a déjà mangé à ${ag.heureMange?new Date(ag.heureMange).toLocaleTimeString():''}</span>`; } sectionBloquee=sec; document.getElementById('codeVerif').value=''; }
window.afficher=()=>{ if(sectionBloquee && allData[sectionBloquee]){ afficherUne(sectionBloquee); return; } let html=''; let totE=0,totM=0; sections.forEach(sec=>{ let obj=allData[sec]||{}; let arr=Object.values(obj); if(arr.length===0) return; let t=arr.length; let m=arr.filter(a=>a.mange).length; totE+=t; totM+=m; html+=`<div class="section-bloc"><h3>${sec} - Enr:${t} | Mang:${m} | Rest:${t-m}</h3><ul>`+arr.map(a=>`<li>${a.code} <span class="${a.mange?'mange':'present'}">${a.mange?'🍽️ MANGÉ'+(a.heureMange?' à '+new Date(a.heureMange).toLocaleTimeString():''):'✅ PRÉSENT'}</span> <button onclick="supprimerCode('${sec}','${a.code}')" class="no-print" style="background:red;color:white;border:none;padding:2px 6px;border-radius:3px;float:right">X</button></li>`).join('')+`</ul></div>`; }); if(html==='') html='<div class="bloc">Aucune donnée pour '+jourActuel+'</div>'; document.getElementById('totalEnregistres').innerText=`ENREGISTRÉS: ${totE}`; document.getElementById('totalMangeGeneral').innerText=`ONT MANGÉ: ${totM}`; document.getElementById('totalRestantGeneral').innerText=`RESTANT: ${totE-totM}`; document.getElementById('conteneurSections').innerHTML=html; }
function afficherUne(sec){ let obj=allData[sec]||{}; let arr=Object.values(obj); let m=arr.filter(a=>a.mange).length; let html=`<div class="section-bloc"><h3>${sec} - ${jourActuel} - Enr:${arr.length} | Mang:${m} | Rest:${arr.length-m}</h3><ul>`+arr.map(a=>`<li>${a.code} <span class="${a.mange?'mange':'present'}">${a.mange?'🍽️ MANGÉ':'✅ PRÉSENT'}</span></li>`).join('')+`</ul></div><button onclick="sectionBloquee='';afficher()" class="no-print" style="background:orange;color:white;padding:8px;border:none;border-radius:5px">Voir toutes</button> <button onclick="imprimerUneSection('${sec}')" class="no-print" style="background:purple;color:white;padding:8px;border:none;border-radius:5px">🖨️ Imprimer</button>`; document.getElementById('conteneurSections').innerHTML=html; }
window.supprimerCode=async(sec,code)=>{ if(prompt("Code Admin:")!==CODE_SECRET) return alert("Faux"); if(!confirm(`Supprimer ${code}?`)) return; await remove(ref(db,'cantine/'+jourActuel+'/'+sec+'/'+code)); }
window.resetJour=async()=>{ if(prompt("Code RESET:")!=="RESET2026") return alert("Faux"); if(!confirm(`Effacer TOUT le ${jourActuel}?`)) return; await remove(ref(db,'cantine/'+jourActuel)); }
window.deconnexion=()=>{ document.getElementById('pagePrincipale').classList.add('cacher'); document.getElementById('pageLogin').classList.remove('cacher'); }
window.allerSection=()=>{ sectionBloquee=document.getElementById('selectSectionNav').value; afficherUne(sectionBloquee); }
window.rechercherAgent=()=>{ let code=document.getElementById('rechercheAgent').value.trim().toUpperCase(); let res=document.getElementById('resultatRecherche'); if(!code){ res.innerHTML=""; return; } for(let sec in allData){ for(let k in allData[sec]){ if(k.includes(code)){ let ag=allData[sec][k]; res.innerHTML=`<div style="border:1px solid green;padding:8px;background:#f8f9fa;border-radius:5px"><b>${k}</b> → ${sec} - ${ag.mange?'🍽️ MANGÉ':'✅ PRÉSENT'}</div>`; return; } } } res.innerHTML=`<span style="color:red">Non trouvé le ${jourActuel}</span>`; }
window.imprimerSectionPrompt=()=>{ let sec=prompt("Section?"); if(!sec) return; sec=sec.toUpperCase(); let found=sections.find(s=>s.includes(sec)); if(found) sec=found; if(!allData[sec]) return alert("Vide"); imprimerUneSection(sec); }
window.imprimerUneSection=(sec)=>{ let arr=Object.values(allData[sec]||{}); let html=`<h1 style="text-align:center">ECOCAJOU SA - CANTINE</h1><h2 style="text-align:center">${sec} - ${jourActuel}</h2><h4 style="text-align:center">Enr:${arr.length} | Mangé:${arr.filter(a=>a.mange).length}</h4><table border="1" style="width:100%;border-collapse:collapse"><tr style="background:#007bff;color:white"><th>N°</th><th>CODE</th><th>STATUT</th><th>HEURE</th></tr>`; arr.forEach((a,i)=>{ let h=a.heureMange?new Date(a.heureMange).toLocaleTimeString():'-'; html+=`<tr><td>${i+1}</td><td>${a.code}</td><td>${a.mange?'MANGÉ':'PRÉSENT'}</td><td>${h}</td></tr>`; }); html+=`</table>`; let w=window.open('','','height=700,width=900'); w.document.write(html); w.document.close(); w.print(); }
window.imprimerTout=()=>{ let html=`<h1 style="text-align:center">ECOCAJOU SA - REGISTRE COMPLET - ${jourActuel}</h1>`; sections.forEach(sec=>{ let obj=allData[sec]||{}; let arr=Object.values(obj); if(arr.length===0) return; html+=`<h3>${sec} - Enr:${arr.length} Mang:${arr.filter(a=>a.mange).length}</h3><table border="1" style="width:100%;border-collapse:collapse;margin-bottom:10px"><tr style="background:#007bff;color:white"><th>N°</th><th>CODE</th><th>STATUT</th></tr>`+arr.map((a,i)=>`<tr><td>${i+1}</td><td>${a.code}</td><td>${a.mange?'MANGÉ':'PRÉSENT'}</td></tr>`).join('')+`</table>`; }); let w=window.open('','','height=800,width=1000'); w.document.write(html); w.document.close(); w.print(); }
</script></body></html>
